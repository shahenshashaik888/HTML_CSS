<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Stock Market</title>

    <style>
        table {
            border-collapse: collapse;
            width: 600px;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
        }
    </style>
</head>

<body>

    <h1>Stock Market</h1>

    <table>

        <thead>
            <tr>
                <th>Company</th>
                <th>Ticker</th>
                <th>Price</th>
            </tr>
        </thead>

        <tbody>

            <tr>
                <td>Apple</td>
                <td>AAPL</td>
                <td>$100</td>
            </tr>

            <tr>
                <td>Microsoft</td>
                <td>MSFT</td>
                <td>$200</td>
            </tr>

            <tr>
                <td>Cisco</td>
                <td>CSCO</td>
                <td>$100.04</td>
            </tr>

        </tbody>

    </table>

</body>

</html>
